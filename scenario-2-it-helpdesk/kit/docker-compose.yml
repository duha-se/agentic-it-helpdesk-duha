# One command starts everything:   docker compose up --build
#   helpdesk-api -> the simulated helpdesk system on http://localhost:8102
#   app          -> the IT helpdesk agent on http://localhost:8000
#   ui           -> the chat UI on http://localhost:7860   (open this one in the browser)
services:
  helpdesk-api:
    build:
      context: .
      dockerfile: services/Dockerfile
    ports:
      - "8102:8102"
    environment:
      HELPDESK_API_KEY: ${HELPDESK_API_KEY:-dev-key-change-me}
      HELPDESK_TODAY: ${HELPDESK_TODAY:-}
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false          # OPENROUTER_API_KEY normally comes from here
    environment:
      # Inside compose the API is reached by its service name, not localhost.
      HELPDESK_API_URL: http://helpdesk-api:8102
      HELPDESK_API_KEY: ${HELPDESK_API_KEY:-dev-key-change-me}
    volumes:
      - embeddings-cache:/app/.cache   # embeddings are computed once, not at every start
      - agent-data:/app/data           # the SQLite file: saved sessions and the approval log
    depends_on:
      helpdesk-api:
        condition: service_healthy
    restart: unless-stopped

  # ui (optional Gradio): only needed if you still want the old Gradio interface on :7860.
  # It requires the kit's ui/app_ui.py file. The new web UI is served from the agent on :8000.
  # ui:
  #   build: { context: ., dockerfile: Dockerfile.ui }
  #   ports: ["7860:7860"]
  #   environment: { APP_URL: "http://app:8000", GRADIO_SERVER_NAME: "0.0.0.0" }
  #   depends_on: { app: { condition: service_healthy } }


volumes:
  embeddings-cache:
  agent-data:
